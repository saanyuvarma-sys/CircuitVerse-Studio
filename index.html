<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CircuitVerse Studio — Design. Simulate. Explore.</title>
<meta name="description" content="CircuitVerse Studio — an engineering learning universe with Electronics, Aerospace and Simulation laboratories.">
<style>
  html,body{margin:0;min-height:100vh;background:#F6F0E4}
  #cv-load{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:grid;place-items:center;min-height:60vh;color:#5C6153;font-size:14px;letter-spacing:.4px;text-align:center;padding:20px}
</style>
</head>
<body>
<div id="cv-load">Loading CircuitVerse Studio…</div>
<script>
/* ============================================================
   CircuitVerse Studio — fixed build loader
   Loads the original single-file app from an immutable pinned
   commit, boots it exactly as the browser would, then applies
   the verified fix.patch changes at runtime:
     1. Run button dead (toolbar binding threw on #emode-seg)
     2. "Browser storage is full" toast spam (auto-prune + retry
        + one-time toast + usage bar + "Free up space" button)
     3. Example circuits (Examples button, 3 loadable circuits,
        first-run seed replaced with a fully-wired LED circuit)
     4. Stat / lab / mission card alignment CSS
   To go back to a plain single-file app, apply fix.patch in this
   repo (git apply fix.patch) and upload that index.html instead.
   ============================================================ */
(function () {
  'use strict';
  var COMMIT = 'b5e8fc4ce424bfabcb7e4962db95daa860e1ccd3';
  var SOURCES = [
    'https://raw.githubusercontent.com/saanyuvarma-sys/CircuitVerse-Studio/' + COMMIT + '/index.html',
    'https://cdn.jsdelivr.net/gh/saanyuvarma-sys/CircuitVerse-Studio@' + COMMIT + '/index.html'
  ];

  function fail() {
    var el = document.getElementById('cv-load');
    if (el) el.innerHTML = 'Could not load the application bundle.<br>Please check your connection and refresh the page.';
  }

  function tryFetch(i) {
    if (i >= SOURCES.length) { fail(); return; }
    fetch(SOURCES[i])
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (src) { if (src) boot(src); else fail(); })
      .catch(function () { tryFetch(i + 1); });
  }

  function boot(src) {
    var doc = new DOMParser().parseFromString(src, 'text/html');
    /* ---- head: favicon + styles (title/description already set) ---- */
    var fav = doc.querySelector('link[rel="icon"]');
    if (fav) {
      var lnk = document.createElement('link');
      lnk.rel = 'icon'; lnk.href = fav.getAttribute('href');
      document.head.appendChild(lnk);
    }
    Array.prototype.forEach.call(doc.querySelectorAll('style'), function (s) {
      var st = document.createElement('style');
      st.textContent = s.textContent;
      document.head.appendChild(st);
    });
    /* ---- body markup (original non-script nodes, in order) ---- */
    var loadEl = document.getElementById('cv-load');
    Array.prototype.forEach.call(doc.body.children, function (node) {
      if (node.tagName === 'SCRIPT') return;
      document.body.appendChild(document.importNode(node, true));
    });
    if (loadEl) loadEl.remove();
    /* ---- execute the app scripts in their original order ---- */
    var bodies = [];
    Array.prototype.forEach.call(doc.querySelectorAll('script'), function (s) { bodies.push(s.textContent); });
    bodies.forEach(function (code) {
      var sc = document.createElement('script');
      sc.textContent = code;
      document.body.appendChild(sc);
    });
    /* ---- apply the verified fixes BEFORE first render ---- */
    applyFixes();
    /* ---- boot: DOMContentLoaded may already have fired ---- */
    if (document.readyState !== 'loading' && window.App && typeof App.init === 'function' && !App.__booted) {
      App.__booted = true;
      App.init();
    }
  }

  function applyFixes() {
    if (!window.App || !App.E || !App.Store) return;
    var E = App.E;

    /* ---------- fix 4: stat / lab / mission card alignment ---------- */
    var fx = document.createElement('style');
    fx.textContent =
      '.stat{display:flex;flex-direction:column;gap:3px;min-height:104px}' +
      '.lab-card p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}' +
      '.lab-card .meta{margin-top:auto;padding-top:10px}' +
      '.mission-card{align-items:center}' +
      '.mission-card h4{display:flex;align-items:center;gap:8px;flex-wrap:wrap}';
    document.head.appendChild(fx);

    /* ---------- fix: panel body renders before tab flag is set ---------- */
    E.panelTab = function (t) {
      App.$$('#epanel-tabs button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
      const body = document.getElementById('epanel-body');
      if (!body) return;
      body.dataset.tab = t;
      if (t === 'insp') E.renderInspector();
      if (t === 'pins') E.renderPins();
      if (t === 'log') E.renderLog();
      if (t === 'issues') E.renderIssues();
    };

    /* ---------- fix: evaluate immediately on Run (LED lights at once) ---------- */
    if (!E.startSim.__fx) {
      const origStart = E.startSim;
      E.startSim = function () {
        const was = E.sim.running;
        origStart.apply(this, arguments);
        if (!was && E.sim.running && E.sim.timer) E.simTick();
      };
      E.startSim.__fx = 1;
    }

    /* ---------- fix 3: example circuits ---------- */
    E.loadExample = function (name) {
      if (E.sim.running) E.pauseSim();
      E.mode = 'edit';
      E.reset();
      if (name === 'blink') {
        const uno = E.place('arduino', 60, 40), r = E.place('res', 340, 250), l = E.place('led', 500, 250), g = E.place('gnd', 500, 350);
        E.addWire({cid: uno.id, pid: 'D13'}, {cid: r.id, pid: 'a'});
        E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
        E.addWire({cid: l.id, pid: 'k'}, {cid: g.id, pid: 'g'});
        E.pinModes[uno.id] = {D13: {mode: 'output', state: 'HIGH', blink: true, period: 1000}};
      } else if (name === 'button') {
        const bat = E.place('bat9', 100, 190), b = E.place('btn', 300, 190), r = E.place('res', 440, 190), l = E.place('led', 600, 190);
        E.addWire({cid: bat.id, pid: 'pos'}, {cid: b.id, pid: 'a'});
        E.addWire({cid: b.id, pid: 'b'}, {cid: r.id, pid: 'a'});
        E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
        E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
      } else { // 'led' — battery + resistor + LED
        const bat = E.place('bat9', 160, 170), r = E.place('res', 360, 170), l = E.place('led', 520, 170);
        E.addWire({cid: bat.id, pid: 'pos'}, {cid: r.id, pid: 'a'});
        E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
        E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
      }
      E.fitView(); E.validate(true);
      E.renderInspector(); E.updateHint(); E.syncToolbar();
      App.Store.save();
    };
    E.openExamples = function () {
      const card = (key, icon, title, desc) => `<div class="card"><h3>${App.I(icon, 15)} ${title}</h3><p class="small muted" style="margin-bottom:10px">${desc}</p><button class="btn sm primary" data-ex="${key}">${App.I('play', 12)} Load example</button></div>`;
      const m = App.UI.modal({
        title: 'Example circuits \u2014 load one, press Run',
        wide: true,
        body: '<div class="grid c3" style="grid-template-columns:repeat(auto-fit,minmax(215px,1fr))">' +
          card('led', 'zap', 'LED + Battery', '9V battery \u2192 220\u03A9 resistor \u2192 LED. The classic first circuit \u2014 press Run and the LED lights instantly.') +
          card('blink', 'cpu', 'Blink D13', 'Arduino Uno D13 \u2192 resistor \u2192 LED \u2192 GND, blink preset applied. Run it and watch the LED pulse at 1 Hz.') +
          card('button', 'glove', 'Button + LED', 'Battery \u2192 push button \u2192 resistor \u2192 LED. Run, then press the button on the canvas to light the LED.') +
          '</div>'
      });
      App.$$('[data-ex]', m.el).forEach(b => b.addEventListener('click', () => {
        E.loadExample(b.dataset.ex);
        m.close();
        App.UI.toast('Example loaded \u2014 press Run to simulate.');
      }));
    };

    /* ---------- fix 2: storage quota handling ---------- */
    App.Store._quotaToastAt = 0;
    App.Store.pruneSessions = function (keep) {
      const st = this.state;
      if (!st || !Array.isArray(st.simSessions)) return 0;
      const before = st.simSessions.length;
      if (keep == null) keep = Math.max(5, Math.floor(before / 2));
      st.simSessions.length = Math.min(before, keep);
      return before - st.simSessions.length;
    };
    App.Store.saveNow = function () {
      try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); }
      catch (e) {
        // First aid: the usual culprit is a pile of old simulation recordings —
        // prune them and retry once before blaming the user's browser.
        let recovered = false;
        try {
          if (this.state && Array.isArray(this.state.simSessions) && this.state.simSessions.length > 5) {
            const removed = this.pruneSessions();
            localStorage.setItem(this.KEY, JSON.stringify(this.state));
            recovered = true;
            try { App.UI.toast('Storage was nearly full \u2014 ' + removed + ' old simulation recording(s) pruned to free space. Your projects and account are safe.', 'warn'); } catch (_) {}
          }
        } catch (_e) { /* still failing */ }
        if (!recovered) {
          // Distinguish blocked storage (private window / site data disabled) from a full quota
          let blocked = false;
          try { localStorage.setItem(this.KEY + '__probe', '1'); localStorage.removeItem(this.KEY + '__probe'); }
          catch (_e2) { blocked = true; }
          const msg = blocked
            ? 'Browser storage is blocked (private window or site data disabled) \u2014 work cannot be saved. Export your data from Settings.'
            : 'Browser storage is genuinely full \u2014 export your data from Settings, then use "Free up space" or "Clear everything" to continue.';
          try {
            if (!this._quotaToastAt || Date.now() - this._quotaToastAt > 60000) { this._quotaToastAt = Date.now(); App.UI.toast(msg, 'warn'); }
          } catch (_) {}
        }
      }
    };
    (function () {
      const origRecord = App.SimLab.record;
      App.SimLab.record = function (sess) {
        // keep browser storage small: decimate dense tracks & trim event logs
        const slimTrack = t => {
          if (!t || !Array.isArray(t.data)) return t;
          const CAP = 1200;
          if (t.data.length <= CAP) return t;
          const step = Math.ceil(t.data.length / CAP);
          const out = [];
          for (let i = 0; i < t.data.length; i += step) out.push(t.data[i]);
          const last = t.data[t.data.length - 1];
          if (out[out.length - 1] !== last) out.push(last);
          return Object.assign({}, t, {data: out});
        };
        const slim = Object.assign({}, sess, {tracks: (sess.tracks || []).map(slimTrack), events: (sess.events || []).slice(-60)});
        origRecord.call(App.SimLab, slim);
        const st = App.Store.state;
        if (st.simSessions && st.simSessions.length > 20) st.simSessions.length = 20;
      };
    })();

    /* ---------- fix 2 (settings UI): usage bar + "Free up space" ---------- */
    (function () {
      const origMount = App.Routes.settings.mount;
      App.Routes.settings.mount = function () {
        origMount.apply(this, arguments);
        try {
          const st = App.Store.state;
          const rawLen = JSON.stringify(st).length;
          const size = App.bytes(rawLen);
          const pct = Math.min(100, Math.max(1, Math.round(rawLen / 5242880 * 100)));
          const exp = document.getElementById('st-export');
          const row = exp ? exp.closest('.btn-row') : null;
          const card = row ? row.closest('.card') : null;
          if (card && row && !document.getElementById('st-prune')) {
            const n = st.simSessions ? st.simSessions.length : 0;
            const p = card.querySelector('p.small');
            if (p) p.insertAdjacentHTML('afterend',
              '<div class="progress" style="margin:10px 0 4px"><i style="width:' + pct + '%"></i></div>' +
              '<div class="tiny muted">' + size + ' used of ~5 MB typical browser quota · ' + n + ' simulation recording' + (n === 1 ? '' : 's') + ' stored. Tip: other apps hosted on the same site domain share this quota.</div>');
            row.insertAdjacentHTML('beforeend', '<button class="btn sm ghost" id="st-prune">' + App.I('reset', 13) + ' Free up space</button>');
            document.getElementById('st-prune').addEventListener('click', () => {
              const removed = App.Store.pruneSessions(5);
              App.Store.saveNow();
              App.UI.toast(removed ? removed + ' old simulation recording(s) cleared — ' + App.bytes(JSON.stringify(App.Store.state).length) + ' now in use.' : 'Nothing to clear — fewer than 5 recordings stored.');
              App.Router.render();
            });
          }
        } catch (e) { console.warn('settings fix', e); }
      };
    })();

    /* ---------- fix 1 + 3: toolbar binding, Examples button, wired starter ---------- */
    let seeded = false; // first-visit flag — replaces the unwired starter exactly once
    if (!E.mountPage.__fx) {
      const origMount = E.mountPage;
      E.mountPage = function () {
        origMount.apply(this, arguments);
        try { fxAfterMount(); } catch (e) { console.warn('lab fix', e); }
      };
      E.mountPage.__fx = 1;
    }

    function fxAfterMount() {
      // Examples button (only exists in the patched toolbar markup)
      const resetBtn = document.getElementById('e-reset');
      if (resetBtn && !document.getElementById('e-examples')) {
        resetBtn.insertAdjacentHTML('afterend', '<button class="btn sm gold" id="e-examples">' + App.I('book', 13) + ' Examples</button>');
      }
      // replace the unwired starter with a WORKING, fully-wired circuit (first visit only)
      if (!seeded && E.comps.length === 3 && !E.wires.length &&
          E.comps.some(c => c.key === 'arduino') && E.comps.some(c => c.key === 'res') && E.comps.some(c => c.key === 'led')) {
        seeded = true;
        E.comps = [];
        const bat = {id: App.uid('c'), key: 'bat9', x: 160, y: 170, rot: 0, props: {}, label: '9V Battery'};
        const r = {id: App.uid('c'), key: 'res', x: 360, y: 170, rot: 0, props: {value: '220\u03A9'}, label: 'Resistor'};
        const l = {id: App.uid('c'), key: 'led', x: 520, y: 170, rot: 0, props: {color: 'Red'}, label: 'LED'};
        E.comps.push(bat, r, l);
        E.addWire({cid: bat.id, pid: 'pos'}, {cid: r.id, pid: 'a'});
        E.addWire({cid: r.id, pid: 'b'}, {cid: l.id, pid: 'a'});
        E.addWire({cid: l.id, pid: 'k'}, {cid: bat.id, pid: 'neg'});
        E.fitView();
        E.validate(true);
        E.renderInspector();
      }
      // full toolbar binding — the original threw on $('#emode-seg') (null) and
      // silently killed EVERY binding below (Run/Pause/Stop/Reset/Validate/PNG/
      // Save/zoom/panel tabs were all dead)
      const tools = document.getElementById('etools');
      if (!tools || tools.dataset.fxBound) return;
      tools.dataset.fxBound = '1';
      const $ = id => document.getElementById(id);
      const on = (id, ev, fn) => { const el = $(id); if (el) el.addEventListener(ev, fn); };
      on('emode-seg', 'click', e => {
        const b = e.target.closest('button'); if (!b) return;
        if (b.dataset.m === 'sim') { E.startSim(); }                    // starts or resumes
        else { if (E.sim.running) E.pauseSim(); E.mode = 'edit'; }      // always returns to edit
        E.syncToolbar(); E.updateHint();
      });
      on('e-run', 'click', () => { E.startSim(); E.syncToolbar(); });
      on('e-pause', 'click', () => { E.pauseSim(); E.syncToolbar(); });
      on('e-stop', 'click', () => { E.stopSim(); E.syncToolbar(); });
      on('e-reset', 'click', () => { E.resetSim(); E.syncToolbar(); });
      on('e-examples', 'click', E.openExamples);
      on('e-rotate', 'click', E.rotateSel);
      on('e-del', 'click', E.deleteSel);
      on('e-validate', 'click', () => {
        const issues = E.validate(false);
        const errs = issues.filter(i => i.sev === 'error').length;
        App.UI.toast(errs ? errs + ' error(s) found — see the Issues panel.' : (issues.length ? issues.length + ' note(s) — see Issues panel.' : 'Circuit looks good. No issues found.'), errs ? 'warn' : 'ok');
        document.body.classList.add('panel-open');
        E.panelTab('issues');
      });
      on('e-png', 'click', E.exportPNG);
      on('e-proj', 'change', e => {
        App.Store.state.ui.activeProjectId = e.target.value || null;
        App.Store.save();
        if (e.target.value) {
          const pr = App.Store.state.projects.find(p => p.id === e.target.value);
          if (pr && pr.data.electronics && !E.comps.length) { E.load(pr.data.electronics); App.UI.toast('Loaded circuit from "' + pr.name + '".'); }
          E.persistIntoProject();
        }
      });
      on('e-save', 'click', () => {
        const id = App.Store.state.ui.activeProjectId;
        if (!id) {
          App.UI.prompt('Save as new project', '<div class="field"><label>Project name</label><input class="input" name="name" value="My Circuit" maxlength="60"></div><div class="field"><label>Description</label><textarea class="input" name="desc" placeholder="What does this circuit do?"></textarea></div>')
            .then(v => {
              if (!v) return;
              const pr = App.Projects.create(v.name, v.desc, 'electronics');
              pr.data.electronics = E.serialize();
              App.Store.state.ui.activeProjectId = pr.id;
              App.Store.save();
              E.persistIntoProject();
              const sel = $('e-proj');
              sel.innerHTML = App.Store.state.projects.map(p => '<option value="' + p.id + '"' + (p.id === pr.id ? ' selected' : '') + '>' + App.esc(p.name) + '</option>').join('');
              App.UI.toast('Project "' + pr.name + '" created and saved.');
            });
        } else {
          E.persistIntoProject();
          const chip = $('save-chip');
          chip.style.display = '';
          chip.textContent = 'Saved \u2713 ' + new Date().toLocaleTimeString(undefined, {hour: '2-digit', minute: '2-digit'});
          App.UI.toast('Circuit saved to project.');
        }
      });
      on('z-in', 'click', () => E.zoom(1.2));
      on('z-out', 'click', () => E.zoom(0.83));
      on('z-fit', 'click', E.fitView);
      on('panel-toggle', 'click', () => document.body.classList.toggle('panel-open'));
      on('epanel-tabs', 'click', e => {
        const b = e.target.closest('button'); if (!b) return;
        E.panelTab(b.dataset.t);
      });
      E.syncToolbar();
    }
  }

  tryFetch(0);
})();
</script>
</body>
</html>
